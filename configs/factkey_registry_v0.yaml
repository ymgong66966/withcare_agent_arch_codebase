# FactKey Registry v0 — Caregiving scenario
# ~130 canonical keys across 12 namespaces
#
# Each key defines:
#   key:              Canonical path (namespace.facet[.subfacet])
#   description:      What this fact represents
#   risk_level:       low | medium | high
#   value_type:       string | enum | code | date | list | object | number | entity_ref
#   cardinality:      single | multi
#   aliases:          Common synonyms / user phrasings (seed list)
#   examples:         Example values
#   canonicalization:  Optional normalization rules
#
# Namespaces (12):
#   identity, contact, insurance, medical, provider, appointment,
#   medication, mobility, dailycare, preference, finance, legal

# ─────────────────────────────────────────────────────────────
# 1. identity.*
# ─────────────────────────────────────────────────────────────
- key: identity.full_name
  description: Full legal name of the person
  risk_level: medium
  value_type: string
  cardinality: single
  aliases: [name, 姓名, full name, legal name]
  examples: ["张小明", "John Smith"]

- key: identity.dob
  description: Date of birth
  risk_level: high
  value_type: date
  cardinality: single
  aliases: [birthday, 出生日期, 生日, date of birth, DOB]
  examples: ["1945-03-15", "March 15, 1945"]
  canonicalization: ISO8601 date

- key: identity.gender
  description: Gender identity
  risk_level: medium
  value_type: enum
  cardinality: single
  aliases: [sex, 性别, gender identity]
  examples: ["male", "female", "other", "unknown"]
  canonicalization: lowercase

- key: identity.language_primary
  description: Primary language spoken
  risk_level: low
  value_type: string
  cardinality: single
  aliases: [language, 语言, 主要语言, primary language, speaks]
  examples: ["zh", "en", "es", "ko"]
  canonicalization: ISO 639-1 code when possible

- key: identity.language_secondary
  description: Secondary languages spoken
  risk_level: low
  value_type: list
  cardinality: multi
  aliases: [other languages, 其他语言, second language]
  examples: [["en", "zh"], ["es"]]

- key: identity.address
  description: Residential address
  risk_level: high
  value_type: object
  cardinality: single
  aliases: [home address, 地址, 住址, residence, where they live]
  examples: [{"line1": "123 Main St", "city": "Chicago", "state": "IL", "zip": "60601"}]

- key: identity.relationship_to_user
  description: Relationship of this entity to the user
  risk_level: low
  value_type: string
  cardinality: single
  aliases: [relationship, 关系, is my, relation]
  examples: ["mom", "dad", "spouse", "grandmother", "self"]
  canonicalization: lowercase

- key: identity.ssn_last4
  description: Last 4 digits of Social Security Number
  risk_level: high
  value_type: string
  cardinality: single
  aliases: [SSN, social security, 社安号, last four]
  examples: ["1234"]

- key: identity.citizenship_status
  description: Citizenship or immigration status
  risk_level: high
  value_type: string
  cardinality: single
  aliases: [citizen, 身份, immigration status, residency status]
  examples: ["US citizen", "permanent resident", "undocumented"]

