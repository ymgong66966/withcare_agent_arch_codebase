{{- if .Values.cronJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-daily-cron
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/component: daily-cron
    app.kubernetes.io/part-of: withcare-agent
spec:
  schedule: {{ .Values.cronJob.schedule | quote }}
  timeZone: {{ .Values.cronJob.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cronJob.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.cronJob.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: daily-cron
    spec:
      activeDeadlineSeconds: {{ .Values.cronJob.activeDeadlineSeconds | default 1800 }}
      backoffLimit: {{ .Values.cronJob.backoffLimit | default 2 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: daily-cron
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name | default "default" }}
          imagePullSecrets:
          - name: ghcr-pull-secret
          {{- if .Values.securityContext.enabled }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          {{- end }}
          restartPolicy: OnFailure
          containers:
          - name: daily-cron
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            command: ["python", "run_daily_cron.py"]
            env:
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
            - name: AWS_REGION
              value: {{ .Values.app.awsRegion | default "us-east-2" | quote }}
            - name: WITHCARE_DDB_PREFIX
              value: {{ .Values.app.ddbPrefix | default "WithCare_" | quote }}
            - name: WITHCARE_DDB_OFF
              value: {{ .Values.app.ddbOff | default "0" | quote }}
            {{- range .Values.app.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- if .Values.app.secrets.enabled }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.name }}
                  key: ANTHROPIC_API_KEY
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.name }}
                  key: TAVILY_API_KEY
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.name }}
                  key: FIRECRAWL_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.name }}
                  key: OPENAI_API_KEY
            - name: LANGCHAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.name }}
                  key: LANGCHAIN_API_KEY
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.name }}
                  key: LANGSMITH_API_KEY
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.secrets.name }}
                  key: GOOGLE_MAPS_API_KEY
            {{- end }}
            resources:
              {{- toYaml .Values.cronJob.resources | nindent 14 }}
            {{- if .Values.securityContext.enabled }}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: false
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
