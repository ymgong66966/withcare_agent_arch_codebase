<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WithCare Agent Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
  background-color: #f7f7f8;
  height: 100vh;
}

.chat-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 800px;
  margin: 0 auto;
  background: white;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
}

/* ── Header ─────────────────────────────────────── */

.chat-header {
  padding: 1rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #e0e0e0;
}

.chat-header h1 {
  font-size: 1.4rem;
  font-weight: 600;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.reset-button {
  padding: 0.4rem 0.8rem;
  background: rgba(255,255,255,0.2);
  color: white;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 0.5rem;
  cursor: pointer;
  font-size: 0.85rem;
  transition: background 0.2s;
}

.reset-button:hover {
  background: rgba(255,255,255,0.35);
}

.conv-id {
  font-family: monospace;
  font-size: 0.75rem;
  background: rgba(255,255,255,0.15);
  padding: 0.2rem 0.5rem;
  border-radius: 0.3rem;
}

.user-id-input {
  font-family: monospace;
  font-size: 0.75rem;
  background: rgba(255,255,255,0.15);
  color: white;
  border: 1px solid rgba(255,255,255,0.3);
  padding: 0.2rem 0.5rem;
  border-radius: 0.3rem;
  width: 140px;
  outline: none;
}

.user-id-input::placeholder {
  color: rgba(255,255,255,0.5);
}

.user-id-input:focus {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.6);
}

/* ── Messages ───────────────────────────────────── */

.messages-container {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  background: #fafafa;
}

.empty-state {
  text-align: center;
  color: #666;
  margin-top: 3rem;
}

.empty-state p {
  margin: 0.5rem 0;
  font-size: 1.1rem;
}

.empty-state .hint {
  font-size: 0.9rem;
  color: #999;
}

.message {
  margin-bottom: 1rem;
  padding: 0.85rem 1rem;
  border-radius: 12px;
  max-width: 85%;
  animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.user-message {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

.agent-message {
  background: white;
  border: 1px solid #e0e0e0;
  color: #333;
  border-bottom-left-radius: 4px;
}

.message-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.4rem;
  font-size: 0.8rem;
}

.user-message .message-header { opacity: 0.8; }
.agent-message .message-header { color: #888; }

.source-badge { font-weight: 600; }

.message-content {
  line-height: 1.6;
  word-wrap: break-word;
  white-space: pre-wrap;
}

/* ── Loading indicator ──────────────────────────── */

.loading-message {
  background: white;
  border: 1px solid #e0e0e0;
  color: #999;
  border-bottom-left-radius: 4px;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid #e0e0e0;
  border-top-color: #667eea;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ── Debug panel ────────────────────────────────── */

.debug-toggle {
  margin-top: 0.4rem;
  text-align: left;
}

.debug-toggle-btn {
  background: none;
  border: none;
  color: #999;
  font-size: 0.75rem;
  cursor: pointer;
  padding: 0.15rem 0;
}

.debug-toggle-btn:hover { color: #667eea; }

.debug-panel {
  margin-top: 0.4rem;
  padding: 0.5rem 0.6rem;
  background: #f5f5f5;
  border-radius: 6px;
  font-size: 0.75rem;
  font-family: monospace;
  color: #555;
  line-height: 1.5;
}

.debug-panel .label {
  color: #888;
  font-weight: 600;
}

.debug-panel .nodes {
  color: #667eea;
}

.logs-panel {
  margin-top: 0.4rem;
  max-height: 300px;
  overflow-y: auto;
  padding: 0.4rem 0.5rem;
  background: #1e1e1e;
  border-radius: 6px;
  font-size: 0.7rem;
  font-family: monospace;
  color: #d4d4d4;
  line-height: 1.4;
  white-space: pre-wrap;
  word-break: break-all;
}

.logs-panel .log-line { margin: 1px 0; }
.logs-panel .log-debug { color: #888; }
.logs-panel .log-info { color: #4fc1ff; }
.logs-panel .log-warning { color: #cca700; }
.logs-panel .log-error { color: #f44747; }

/* ── Input area ─────────────────────────────────── */

.input-container {
  padding: 1rem;
  background: white;
  border-top: 1px solid #e0e0e0;
}

.input-wrapper {
  display: flex;
  gap: 0.5rem;
  align-items: flex-end;
}

.message-input {
  flex: 1;
  padding: 0.75rem;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  resize: none;
  font-family: inherit;
  font-size: 1rem;
  max-height: 120px;
  min-height: 44px;
}

.message-input:focus {
  outline: none;
  border-color: #667eea;
}

.message-input:disabled {
  background-color: #f5f5f5;
  color: #999;
}

.send-button {
  padding: 0.75rem 1.2rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 600;
  transition: all 0.2s;
  height: 44px;
}

.send-button:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}

.send-button:disabled {
  background: #ccc;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.input-info {
  margin-top: 0.4rem;
  font-size: 0.78rem;
  color: #999;
  text-align: center;
}

/* ── Scrollbar ──────────────────────────────────── */

.messages-container::-webkit-scrollbar { width: 6px; }
.messages-container::-webkit-scrollbar-track { background: #f1f1f1; }
.messages-container::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
.messages-container::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

/* ── Mobile ─────────────────────────────────────── */

@media (max-width: 768px) {
  .chat-container { max-width: 100%; }
  .chat-header { padding: 0.75rem; }
  .chat-header h1 { font-size: 1.15rem; }
  .header-controls { flex-direction: column; gap: 0.4rem; }
  .message { max-width: 95%; }
  .input-container { padding: 0.75rem; }
}
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h1>WithCare Agent</h1>
    <div class="header-controls">
      <input type="text" class="user-id-input" id="userIdInput" placeholder="Enter user ID..." />
      <span class="conv-id" id="convIdDisplay">New conversation</span>
      <button class="reset-button" onclick="resetConversation()">Reset</button>
    </div>
  </div>

  <div class="messages-container" id="messagesContainer">
    <div class="empty-state" id="emptyState">
      <p>WithCare Agent Chat</p>
      <p class="hint">Send a message to start a conversation.</p>
    </div>
  </div>

  <div class="input-container">
    <div class="input-wrapper">
      <textarea
        id="messageInput"
        class="message-input"
        placeholder="Type a message..."
        rows="1"
      ></textarea>
      <button id="sendButton" class="send-button" onclick="sendMessage()">Send</button>
    </div>
    <div class="input-info">Enter to send &middot; Shift+Enter for new line</div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────

let conversationId = null;
let messages = [];      // {role, content, debug?}
let isLoading = false;

// userId: load from URL param first, then localStorage
const urlParams = new URLSearchParams(window.location.search);
const savedUserId = urlParams.get('userId') || localStorage.getItem('withcare_user_id') || '';

const userIdInput = document.getElementById('userIdInput');
userIdInput.value = savedUserId;

// Save to localStorage on change
userIdInput.addEventListener('change', () => {
  const val = userIdInput.value.trim();
  if (val) {
    localStorage.setItem('withcare_user_id', val);
  } else {
    localStorage.removeItem('withcare_user_id');
  }
});

function getUserId() {
  return userIdInput.value.trim() || null;
}

const container    = document.getElementById('messagesContainer');
const emptyState   = document.getElementById('emptyState');
const input        = document.getElementById('messageInput');
const sendBtn      = document.getElementById('sendButton');
const convIdEl     = document.getElementById('convIdDisplay');

// ── Input handling ───────────────────────────────────────────────────

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// ── Send message ─────────────────────────────────────────────────────

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isLoading) return;

  // Add user message to UI
  addMessage('user', text);
  input.value = '';
  input.style.height = 'auto';

  setLoading(true);

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        conversation_id: conversationId,
        user_id: getUserId(),
      }),
    });

    if (!resp.ok) {
      const err = await resp.text();
      addMessage('agent', `Error: ${resp.status} — ${err}`);
      return;
    }

    const data = await resp.json();
    conversationId = data.conversation_id;
    convIdEl.textContent = conversationId.substring(0, 8) + '...';

    // Render recent history on first message (e.g., onboarding greeting)
    if (data.recent_history && messages.length <= 1) {
      for (const msg of data.recent_history) {
        const uiRole = msg.role === 'user' ? 'user' : 'agent';
        addMessage(uiRole, msg.content);
      }
    }

    addMessage('agent', data.reply, data.debug);
  } catch (err) {
    addMessage('agent', `Network error: ${err.message}`);
  } finally {
    setLoading(false);
  }
}

// ── Render helpers ───────────────────────────────────────────────────

function addMessage(role, content, debug) {
  messages.push({ role, content, debug });
  renderMessage(role, content, debug);
  emptyState.style.display = 'none';
  scrollToBottom();
}

function renderMessage(role, content, debug) {
  const wrapper = document.createElement('div');

  if (role === 'user') {
    wrapper.className = 'message user-message';
    wrapper.innerHTML = `
      <div class="message-header">
        <span class="source-badge">You</span>
      </div>
      <div class="message-content">${escapeHtml(content)}</div>
    `;
  } else {
    wrapper.className = 'message agent-message';
    const debugHtml = debug ? buildDebugHtml(debug) : '';
    wrapper.innerHTML = `
      <div class="message-header">
        <span class="source-badge">Agent</span>
      </div>
      <div class="message-content">${escapeHtml(content)}</div>
      ${debugHtml}
    `;
  }

  container.appendChild(wrapper);
}

function buildDebugHtml(debug) {
  const id = 'dbg-' + Math.random().toString(36).substring(2, 8);
  const nodes = (debug.nodes_visited || []).join(' → ') || 'none';
  const agent = debug.current_agent || 'none';
  const mode  = debug.turn_mode || '—';
  const reason = debug.turn_reason || '';

  let reqInfo = 'none';
  if (debug.active_request) {
    const r = debug.active_request;
    reqInfo = `${r.name} [${r.status}]`;
    if (r.awaiting_user_input) reqInfo += ' (awaiting input)';
  }

  const total   = debug.total_requests ?? '—';
  const pending  = debug.pending_queue_size ?? '—';

  // Per-node routing decisions
  let nodeRoutingHtml = '';
  const nr = debug.node_routing || {};
  if (Object.keys(nr).length > 0) {
    const lines = Object.entries(nr).map(([node, routing]) =>
      `  ${escapeHtml(node)}: ${escapeHtml(JSON.stringify(routing))}`
    ).join('\n');
    nodeRoutingHtml = `<div style="margin-top:4px"><span class="label">Routing decisions:</span><pre style="margin:2px 0;white-space:pre-wrap;font-size:0.7rem">${lines}</pre></div>`;
  }

  // Error info
  let errorHtml = '';
  if (debug.error) {
    errorHtml = `<div style="color:#e53e3e;margin-top:4px"><span class="label">ERROR: </span>${escapeHtml(debug.error)}</div>`;
  }

  // Memory context
  const memId = 'mem-' + id;
  let memoryHtml = '';
  const mem = debug.memory_context || null;
  if (mem) {
    const sections = [];

    // Profile facts retrieved from DDB
    const facts = mem.profile_facts_retrieved || {};
    const factKeys = Object.keys(facts);
    if (factKeys.length > 0) {
      sections.push('<div style="margin-bottom:4px"><strong>Facts from DDB (' + factKeys.length + '):</strong></div>');
      factKeys.forEach(k => {
        const f = facts[k];
        const val = typeof f.value === 'object' ? JSON.stringify(f.value) : f.value;
        const ver = f.verification_level || '?';
        const conf = f.confidence != null ? (' conf=' + f.confidence) : '';
        sections.push(`<div style="margin-left:8px">- ${escapeHtml(k)}: ${escapeHtml(String(val))} <span style="color:#888">[${escapeHtml(ver)}${conf}]</span></div>`);
      });
    } else {
      sections.push('<div style="color:#888">No stored facts for this entity</div>');
    }

    // Pre-filter results
    const preFilter = mem.fact_pre_filter || null;
    if (preFilter) {
      const pa = preFilter.pre_answered || [];
      const rem = preFilter.remaining_questions || [];
      if (pa.length > 0) {
        sections.push('<div style="margin-top:6px"><strong>Pre-answered from facts (' + pa.length + '):</strong></div>');
        pa.forEach(p => {
          sections.push(`<div style="margin-left:8px;color:#4fc1ff">✓ ${escapeHtml(p.question)}</div>`);
          sections.push(`<div style="margin-left:16px;color:#888">→ ${escapeHtml(p.answer_summary || '')} [${(p.fact_keys_used||[]).join(', ')}]</div>`);
        });
      }
      if (rem.length > 0) {
        sections.push('<div style="margin-top:4px"><strong>Still need to ask (' + rem.length + '):</strong></div>');
        rem.forEach(q => {
          sections.push(`<div style="margin-left:8px">? ${escapeHtml(q)}</div>`);
        });
      }
    }

    // Disputed facts
    const disputed = mem.disputed_fact_keys || [];
    if (disputed.length > 0) {
      sections.push('<div style="margin-top:6px;color:#cca700"><strong>Disputed facts:</strong> ' + disputed.map(k => escapeHtml(k)).join(', ') + '</div>');
    }

    // Request query debug
    const rqd = mem.request_query_debug || null;
    if (rqd) {
      sections.push('<div style="margin-top:6px"><strong>Request Query Debug:</strong></div>');
      sections.push(`<div style="margin-left:8px">user_id: ${escapeHtml(rqd.user_id || '(none)')}</div>`);
      sections.push(`<div style="margin-left:8px">entity_id: ${escapeHtml(rqd.entity_id || '(none)')}</div>`);
      sections.push(`<div style="margin-left:8px">total requests returned: ${rqd.recent_reqs_count || 0}</div>`);
      const rawReqs = rqd.recent_reqs_raw || [];
      if (rawReqs.length > 0) {
        sections.push('<div style="margin-left:8px;margin-top:4px"><strong>Raw requests from DDB:</strong></div>');
        rawReqs.forEach((r, idx) => {
          const title = r.title || r.name || 'Untitled';
          const status = r.status || '?';
          const entity = r.subject_entity_id || '';
          const created = r.created_at || '?';
          const reqType = r.request_type || '';
          const rid = r.request_id || '';
          sections.push(`<div style="margin-left:16px;margin-top:2px"><span style="color:#4fc1ff">${idx+1}.</span> ${escapeHtml(title)} | <span style="color:#cca700">status=${escapeHtml(status)}</span> | for=${escapeHtml(entity)} | type=${escapeHtml(reqType)}</div>`);
          sections.push(`<div style="margin-left:24px;color:#888">id=${escapeHtml(rid)} | created=${escapeHtml(String(created))}</div>`);
        });
      } else {
        sections.push('<div style="margin-left:8px;color:#888">(no requests returned from DDB)</div>');
      }
      // Show the formatted block sent to LLM
      const blockSent = rqd.requests_block_sent_to_llm || '';
      if (blockSent && blockSent !== '(no request history)') {
        sections.push('<div style="margin-left:8px;margin-top:4px"><strong>Requests block sent to LLM:</strong></div>');
        sections.push(`<pre style="margin-left:16px;font-size:11px;white-space:pre-wrap;color:#ccc">${escapeHtml(blockSent)}</pre>`);
      }
    }

    // Summary result (readiness)
    if (mem.readiness) {
      sections.push(`<div style="margin-top:4px"><strong>Readiness:</strong> ${escapeHtml(mem.readiness)}</div>`);
    }

    memoryHtml = `
      <div class="debug-toggle" style="margin-top:4px">
        <button class="debug-toggle-btn" onclick="toggleDebug('${memId}')">memory context ▸</button>
        <div class="logs-panel" id="${memId}" style="display:none">${sections.join('\n')}</div>
      </div>
    `;
  }

  // Logs
  const logsId = 'logs-' + id;
  let logsHtml = '';
  const logs = debug.logs || [];
  if (logs.length > 0) {
    const logLines = logs.map(line => {
      const escaped = escapeHtml(line);
      let cls = 'log-debug';
      if (line.includes(' ERROR:') || line.includes(' ERROR ')) cls = 'log-error';
      else if (line.includes(' WARNING:') || line.includes(' WARNING ')) cls = 'log-warning';
      else if (line.includes(' INFO:') || line.includes(' INFO ')) cls = 'log-info';
      return `<div class="log-line ${cls}">${escaped}</div>`;
    }).join('');
    logsHtml = `
      <div class="debug-toggle" style="margin-top:4px">
        <button class="debug-toggle-btn" onclick="toggleDebug('${logsId}')">logs (${logs.length}) ▸</button>
        <div class="logs-panel" id="${logsId}" style="display:none">${logLines}</div>
      </div>
    `;
  }

  return `
    <div class="debug-toggle">
      <button class="debug-toggle-btn" onclick="toggleDebug('${id}')">debug info ▾</button>
      <div class="debug-panel" id="${id}">
        <div><span class="label">Nodes: </span><span class="nodes">${escapeHtml(nodes)}</span></div>
        <div><span class="label">Agent: </span>${escapeHtml(agent)}</div>
        <div><span class="label">Mode:  </span>${escapeHtml(mode)}${reason ? ' — ' + escapeHtml(reason) : ''}</div>
        <div><span class="label">Request: </span>${escapeHtml(reqInfo)}</div>
        <div><span class="label">Total requests: </span>${total} &middot; <span class="label">Queued: </span>${pending}</div>
        ${nodeRoutingHtml}
        ${errorHtml}
        ${memoryHtml}
        ${logsHtml}
      </div>
    </div>
  `;
}

function toggleDebug(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const btn = el.previousElementSibling;
  if (el.style.display === 'none') {
    el.style.display = 'block';
    btn.textContent = 'debug info ▾';
  } else {
    el.style.display = 'none';
    btn.textContent = 'debug info ▸';
  }
}

function setLoading(on) {
  isLoading = on;
  sendBtn.disabled = on;
  input.disabled = on;

  // Add / remove loading bubble
  const existing = document.getElementById('loadingBubble');
  if (on && !existing) {
    const el = document.createElement('div');
    el.id = 'loadingBubble';
    el.className = 'message loading-message';
    el.innerHTML = '<div class="spinner"></div> Thinking...';
    container.appendChild(el);
    scrollToBottom();
  } else if (!on && existing) {
    existing.remove();
  }
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    container.scrollTop = container.scrollHeight;
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Reset ────────────────────────────────────────────────────────────

async function resetConversation() {
  if (conversationId) {
    try {
      await fetch('/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversation_id: conversationId }),
      });
    } catch (_) { /* ignore */ }
  }

  conversationId = null;
  messages = [];
  convIdEl.textContent = 'New conversation';

  // Clear rendered messages
  container.innerHTML = '';
  const empty = document.createElement('div');
  empty.className = 'empty-state';
  empty.id = 'emptyState';
  empty.innerHTML = '<p>WithCare Agent Chat</p><p class="hint">Send a message to start a conversation.</p>';
  container.appendChild(empty);
}
</script>
</body>
</html>
